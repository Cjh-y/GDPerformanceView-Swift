name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: List schemes and targets
        run: |
          xcodebuild -list -project GDPerformanceView-Swift.xcodeproj || true
          echo "---- Repo structure ----"
          find . -maxdepth 3 -iname "*.xcodeproj" -o -iname "*.xcworkspace"

      - name: Build (unsigned)
        run: |
          xcodebuild build \
            -project GDPerformanceView-Swift.xcodeproj \
            -scheme GDPerformanceView-iOS \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build

      - name: Inspect build output
        run: |
          echo "---- Everything under build/Build/Products ----"
          find build/Build/Products -maxdepth 3
          echo "---- Looking for .app anywhere ----"
          find build -iname "*.app" -maxdepth 6 || echo "No .app found"
          echo "---- Looking for .framework anywhere ----"
          find build -iname "*.framework" -maxdepth 6 || echo "No .framework found"

      - name: Package IPA (only if .app exists)
        run: |
          APP_PATH=$(find build/Build/Products -iname "*.app" -maxdepth 3 | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "No .app product found — this scheme likely builds a library/framework, not an App. See 'Inspect build output' step above."
            exit 1
          fi
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r GDPerformanceView-unsigned.ipa Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: GDPerformanceView-unsigned.ipa
